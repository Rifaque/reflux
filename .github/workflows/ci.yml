name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    env:
      # Linux installs the engine and a display below, so tests that need them must run there rather than
      # skip themselves. Windows runners have no libmpv; its engine tests are skipped and say so.
      REFLUX_REQUIRE_ENGINE_TESTS: ${{ startsWith(matrix.os, 'ubuntu') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Real-engine tests (libmpv playback/probing against FFmpeg-generated media) run where libmpv is available
      # and are skipped elsewhere. The X server, window manager, and compositor are for the window tests below.
      - name: Install libmpv, FFmpeg, and a virtual desktop
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $(cat tools/ci/linux-packages.txt)

      - name: Build and test
        run: ./gradlew check :tools:cli:installDist --stacktrace

      # The real desktop shell in a real window, on a virtual display. tools/ci/linux-check.sh runs these same
      # two steps in a container, for reproducing this job locally.
      - name: Desktop window tests
        if: runner.os == 'Linux'
        run: tools/ci/desktop-window-tests.sh --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          path: '**/build/reports/tests/'

  android:
    name: Android (unit tests, lint, minified release)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      # The release variant is built minified and unsigned here: R8 and its keep rules are checked on every change;
      # signing happens only in the release workflow.
      - name: Unit tests, lint, and a release build
        run: ./gradlew :android:app:testDebugUnitTest :android:app:lintRelease :android:app:assembleRelease --stacktrace

  website:
    name: Website (build, audit, links)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run build
      - run: node scripts/check-links.mjs

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Reviewed findings (fake values in tests) are listed in .gitleaksignore; anything else fails.
      - name: gitleaks over the whole history
        run: docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.24.3 git /repo --redact --no-banner --gitleaks-ignore-path /repo/.gitleaksignore

