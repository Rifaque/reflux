name: CI

# Every push and pull request, from a clean checkout (docs/release/RELEASE.md, "CI"). Actions are pinned by commit, with the
# release they are in beside each; nothing here holds a secret.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Linux 75 minutes, Windows 60 (B-079, the owner's decision of 2026-11-22). Linux's UI tests render in software on one
    # core and need 51–60 minutes there (the window tests, 2–5 minutes more, now run in a job of their own); parallel test
    # JVMs halved that but made the hosted runs less reliable, so they were reverted. Every test still runs and must pass.
    timeout-minutes: ${{ startsWith(matrix.os, 'ubuntu') && 75 || 60 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    env:
      # Linux installs the engine and a display below, so tests that need them must run there rather than
      # skip themselves. Windows runners have no libmpv; its engine tests are skipped and say so.
      REFLUX_REQUIRE_ENGINE_TESTS: ${{ startsWith(matrix.os, 'ubuntu') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      # Caches are written only by pushes to main and beta-3 (by default setup-gradle writes only on the default branch,
      # so beta-3 kept restoring main's old build cache); pull requests and other branches only read. GitHub scopes
      # caches by branch, so nothing written here is read by main (docs/engineering/CI-PERFORMANCE-AUDIT.md, L1).
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ !(github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta-3')) }}

      # Real-engine tests (libmpv playback/probing against FFmpeg-generated media) run where libmpv is available
      # and are skipped elsewhere. The X server, window manager, and compositor are for the window tests below.
      - name: Install libmpv, FFmpeg, and a virtual desktop
        if: runner.os == 'Linux'
        run: sudo apt-get update && xargs -a tools/ci/linux-packages.txt sudo apt-get install -y --no-install-recommends

      # The runner image and the installed system packages (libmpv, Mesa, fonts) as one value the test tasks declare as
      # an input (build.gradle.kts), so a test result is never reused from the build cache after either changes.
      - name: Fingerprint the test environment
        shell: bash
        run: |
          environment="$ImageOS $ImageVersion $RUNNER_ARCH"
          if [ "$RUNNER_OS" = Linux ]; then
            # shellcheck disable=SC2016 # ${Package} and ${Version} are dpkg-query's format fields, not shell variables
            environment+=$'\n'$(xargs -a tools/ci/linux-packages.txt dpkg-query -W -f='${Package} ${Version}\n')
          fi
          printf '%s\n' "$environment"
          echo "REFLUX_TEST_ENVIRONMENT=$(printf '%s\n' "$environment" | sha256sum | cut -c1-16)" >> "$GITHUB_ENV"

      # -Preflux.android=false: the Android modules have a job of their own, with the SDK set up on purpose.
      # bash on Windows too: PowerShell would split -Preflux.android=false into two arguments.
      # On Linux, text is measured with Liberation Sans, not DejaVu Sans (tools/ci/fonts.conf says why): the layout
      # tests that fit the details page's actions into a phone's width model a phone's font, and DejaVu is wider than
      # Android's and Windows' defaults. Empty on Windows, which does not read it.
      - name: Build and test
        shell: bash
        env:
          FONTCONFIG_FILE: ${{ runner.os == 'Linux' && format('{0}/tools/ci/fonts.conf', github.workspace) || '' }}
        run: ./gradlew check :tools:cli:installDist -Preflux.android=false --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-${{ matrix.os }}
          path: '**/build/reports/tests/'

  # The real desktop shell in real windows, on a virtual display: Linux only (the Windows runner has no display for
  # them). Its own runner, beside "Check", instead of a step after it, so it no longer adds its minutes to the Linux
  # check's (docs/engineering/CI-PERFORMANCE-AUDIT.md, L3). The same script, the same Gradle task and JVM as before,
  # the same environment as the Linux check (engine tests required; no FONTCONFIG_FILE, as before). tools/ci/
  # linux-check.sh still runs "Build and test" and these together in a container, for reproducing CI locally.
  window-tests:
    name: Desktop window tests (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      REFLUX_REQUIRE_ENGINE_TESTS: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ !(github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta-3')) }}
      - name: Install libmpv, FFmpeg, and a virtual desktop
        run: sudo apt-get update && xargs -a tools/ci/linux-packages.txt sudo apt-get install -y --no-install-recommends
      - name: Fingerprint the test environment
        shell: bash
        run: |
          environment="$ImageOS $ImageVersion $RUNNER_ARCH"
          # shellcheck disable=SC2016 # ${Package} and ${Version} are dpkg-query's format fields, not shell variables
          environment+=$'\n'$(xargs -a tools/ci/linux-packages.txt dpkg-query -W -f='${Package} ${Version}\n')
          printf '%s\n' "$environment"
          echo "REFLUX_TEST_ENVIRONMENT=$(printf '%s\n' "$environment" | sha256sum | cut -c1-16)" >> "$GITHUB_ENV"
      - name: Desktop window tests
        run: tools/ci/desktop-window-tests.sh --stacktrace
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-window-tests
          path: '**/build/reports/tests/'

  android:
    name: Android (unit tests, lint, platform API, minified release)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ !(github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta-3')) }}
      # The release variant is built minified and unsigned here: R8 and its keep rules are checked on every change;
      # signing happens only in the release workflow. checkDebugPlatformApi is the Java-on-old-Android check.
      - name: Unit tests, lint, platform API, a release build, and the third-party notices
        run: ./gradlew :android:app:testDebugUnitTest :android:app:lintRelease :android:app:checkDebugPlatformApi :android:app:assembleRelease :android:app:bundleRelease checkThirdPartyNotices --stacktrace
      - name: The release build is the permanent identity, not debuggable
        run: |
          aapt=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -1)
          badging=$("$aapt" dump badging android/app/build/outputs/apk/release/app-release-unsigned.apk)
          echo "$badging" | head -1
          expected=$(sed -n 's/^reflux.android.applicationId=//p' gradle.properties)
          echo "$badging" | grep -q "package: name='$expected'" || { echo "the package is not $expected"; exit 1; }
          if echo "$badging" | grep -q "application-debuggable"; then echo "the release is debuggable"; exit 1; fi

  website:
    name: Website (audit, build, production checks, links, layout)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm test
      - run: npm run build
      # No source maps, no development addresses, nothing that looks like a secret, every route rendered.
      - run: node scripts/check-dist.mjs
      # trakt.tv answers with about 32 KB of headers, over Node's 16 KB default.
      - run: node --max-http-header-size=65536 scripts/check-links.mjs
      # Every page at seven sizes, from a large display to a phone on its side: no sideways scrolling, readable text,
      # targets big enough to tap, and the performance budget; the screenshots are kept for review (docs/release/WEBSITE.md).
      - run: npx playwright install --with-deps chromium
      - run: node scripts/check-layout.mjs --screenshots
      # The roadmap page and its easter egg: readable without script, keyboard-operable, Escape and focus, reduced motion, no CSP error.
      - run: node scripts/check-roadmap.mjs
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website-layout
          path: website/test-results/layout
          retention-days: 14

  release-tools:
    name: Release tools and documentation links
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -I -m unittest discover -s tools/release -p 'test_*.py' -v
      # The libmpv source fetcher and the release workflow's libmpv cache key (tools/ci).
      - run: python3 -I -m unittest discover -s tools/ci -p 'test_*.py' -v
      # Every relative link and #anchor in the repository's Markdown reaches its file and heading (README.md).
      - run: python3 -I tools/docs/check_links.py .

  workflows:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo:ro" --workdir /repo rhysd/actionlint:1.7.7 -color

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Reviewed findings (fake values in tests) are listed in .gitleaksignore; anything else fails.
      - name: gitleaks over the whole history
        run: docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.24.3 git /repo --redact --no-banner --gitleaks-ignore-path /repo/.gitleaksignore

  # One check that stands for all of them (docs/engineering/CI-PERFORMANCE-AUDIT.md, S2): it runs whatever happened to
  # the others and passes only if every job above succeeded. Failed, cancelled or skipped all count against it (no job
  # here is skipped on purpose; the Windows check has no window-test step, and the window tests are a Linux job), so a
  # missing or skipped job can never pass for green. Branch protection should require this check, by its name.
  all-checks:
    name: All checks passed
    if: always()
    needs: [check, window-tests, android, website, release-tools, workflows, secrets]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 -I - <<'PY'
          import json, os, sys
          results = {job: value["result"] for job, value in json.loads(os.environ["RESULTS"]).items()}
          for job, result in sorted(results.items()):
              print(f"{job}: {result}")
          expected = {"check", "window-tests", "android", "website", "release-tools", "workflows", "secrets"}
          if set(results) != expected:
              sys.exit(f"the jobs reported are not the jobs expected: {sorted(set(results) ^ expected)}")
          failed = sorted(job for job, result in results.items() if result != "success")
          sys.exit(f"not successful: {', '.join(failed)}" if failed else 0)
          PY
