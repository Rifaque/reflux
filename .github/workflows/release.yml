name: Release

# Two modes (docs/RELEASE.md, "Release system"):
#
# - Rehearsal, on every push: the release built from the pushed commit exactly as a release is (Reflux's Windows libmpv
#   from source, the Android APK and bundle, the Windows and Linux archives, the libmpv source bundle, SHA256SUMS, the
#   manifest), the Android packages signed by a throwaway key made in the runner whose certificate says it is not for
#   distribution. Every artifact gets GitHub's signed build provenance, verified in the same job against this
#   repository, this workflow, and this commit. Nothing is tagged, released, or kept: no app binary is uploaded.
# - Release, run by hand with a tag: the same build from the tagged commit, signed with the upload key, attested, and
#   a DRAFT GitHub release holding the desktop files and records only (store-only Android: the APK and AAB are built,
#   verified, and attested, and reach the stores as this run's artifacts, never the public release), which a separate
#   job downloads and verifies on another operating system. Publishing the draft, and uploading to the stores, are
#   people's decisions, made after the release checklist.
on:
  push:
  workflow_dispatch:
    inputs:
      tag:
        description: "The release tag to build, v<version> (it must exist and match reflux.version)"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  libmpv:
    name: Windows libmpv from source
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.sha }}
      # The build is reproducible and pinned (tools/libmpv/README.md), so an earlier build of the same recipe is
      # reused; whatever is restored must still match the pinned SHA-256s below, or the job fails.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: build/libmpv
          key: libmpv-${{ hashFiles('tools/libmpv/**', 'desktop/app/packaging/libmpv-windows.properties') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: |
          docker build -t reflux-libmpv tools/libmpv
          mkdir -p build/libmpv
          docker run --rm -v "$PWD:/src:ro" -v "$PWD/build/libmpv:/out" reflux-libmpv
      - run: |
          pin() { sed -n "s/^$1=//p" desktop/app/packaging/libmpv-windows.properties; }
          echo "$(pin dllSha256)  build/libmpv/libmpv-2.dll" | sha256sum -c
          echo "$(pin sourceSha256)  build/libmpv/libmpv-source.tar.xz" | sha256sum -c
      # The LGPL library and its source, passed to the Windows job; not an app build.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: libmpv
          path: build/libmpv/
          retention-days: 1

  linux:
    name: Linux archive
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write      # provenance signing (rehearsal)
      attestations: write  # provenance storage (rehearsal)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # A release carries Trakt's production Client ID (DECISIONS.md, "Trakt is the metadata provider"): a repository
      # variable, not a secret (it identifies the application), never printed. A rehearsal builds without one.
      - name: The metadata provider's Client ID is set (release)
        if: inputs.tag != ''
        env:
          REFLUX_TRAKT_CLIENT_ID: ${{ vars.REFLUX_TRAKT_CLIENT_ID }}
        run: |
          [ -n "${REFLUX_TRAKT_CLIENT_ID// /}" ] || { echo "::error::a release needs the repository variable REFLUX_TRAKT_CLIENT_ID (Trakt's production Client ID; docs/RELEASE.md, \"Metadata provider\")"; exit 1; }
      - run: ./gradlew --no-configuration-cache releaseInfo :desktop:app:packageDesktopArchive -Preflux.android=false
        env:
          REFLUX_TRAKT_CLIENT_ID: ${{ inputs.tag != '' && vars.REFLUX_TRAKT_CLIENT_ID || '' }}
      - run: |
          mkdir out
          for f in desktop/app/build/release/*.tar.gz; do cp "$f" out/; cp build/release/release-info.json "out/$(basename "$f").release-info.json"; done
          (cd out && sha256sum ./*.tar.gz | tee SHA256SUMS)
      # A rehearsal attests the archive where it was built and checks the attestation here; a release attests it with
      # the rest of the release.
      - name: Build provenance (rehearsal)
        if: inputs.tag == ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/*.tar.gz
      - name: Verify the provenance (rehearsal)
        if: inputs.tag == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in out/*.tar.gz; do
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --source-digest "$GITHUB_SHA"
          done
      - if: inputs.tag != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: out/

  release:
    name: Android, Windows, and provenance
    needs: [libmpv, linux]
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write      # provenance signing
      attestations: write  # provenance storage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - if: inputs.tag != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux
          path: build/linux
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: libmpv
          path: build/libmpv
      # The tag is v<reflux.version>, an annotated tag, on the commit this run built, and that commit is on main
      # (docs/VERSIONING.md). release.py build checks the first three again from the Gradle release identity.
      - name: The tag is the version
        if: inputs.tag != ''
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version=$(sed -n 's/^reflux.version=//p' gradle.properties)
          test "v$version" = "$TAG" || { echo "tag $TAG is not v$version"; exit 1; }
          test "$(git cat-file -t "refs/tags/$TAG")" = tag || { echo "tag $TAG is not an annotated tag"; exit 1; }
          test "$(git rev-parse "$TAG^{commit}")" = "$(git rev-parse HEAD)" || { echo "tag $TAG is not the checked-out commit"; exit 1; }
          # On main, or on its own hotfix branch (docs/VERSIONING.md, "Hotfixes": hotfix/<version>).
          git merge-base --is-ancestor HEAD origin/main || git merge-base --is-ancestor HEAD "origin/hotfix/$version" 2>/dev/null \
            || { echo "$TAG is neither on main nor on hotfix/$version"; exit 1; }
      # A release: the upload key lives only in GitHub's encrypted secrets (docs/RELEASE.md, "Signing"); it is written
      # to the runner's temporary folder, passed to the build as REFLUX_SIGNING_* through a file, and never printed.
      - name: Build, sign, checksum, and describe (release)
        if: inputs.tag != ''
        shell: bash
        env:
          # Trakt's production Client ID (a variable, not a secret); release.py refuses a release without it.
          REFLUX_TRAKT_CLIENT_ID: ${{ vars.REFLUX_TRAKT_CLIENT_ID }}
          # The upload key's certificate SHA-256 (not a secret): the tool refuses an APK signed by any other key.
          REFLUX_EXPECTED_SIGNER_SHA256: ${{ vars.REFLUX_UPLOAD_CERT_SHA256 }}
          TAG: ${{ inputs.tag }}
          UPLOAD_KEY: ${{ secrets.REFLUX_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.REFLUX_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.REFLUX_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.REFLUX_UPLOAD_KEY_PASSWORD }}
        run: |
          key="$RUNNER_TEMP/upload.jks"
          printf '%s' "$UPLOAD_KEY" | base64 -d > "$key"
          printf 'REFLUX_SIGNING_STORE_FILE=%s\nREFLUX_SIGNING_STORE_PASSWORD=%s\nREFLUX_SIGNING_KEY_ALIAS=%s\nREFLUX_SIGNING_KEY_PASSWORD=%s\n' \
            "$key" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > "$RUNNER_TEMP/signing.env"
          python -I tools/release/release.py build --signing-env "$RUNNER_TEMP/signing.env" --out out --tag "$TAG" --add build/linux/*.tar.gz
          rm -f "$key" "$RUNNER_TEMP/signing.env"
      # A rehearsal: a throwaway key made here (tools/release/make-dry-run-key.py, its certificate "Reflux internal dry
      # run (not for distribution)"), never the upload key, and no secret of any kind.
      - name: Build, sign with a throwaway key, checksum, and describe (rehearsal)
        if: inputs.tag == ''
        shell: bash
        run: |
          python -I tools/release/make-dry-run-key.py
          python -I tools/release/release.py build --signing-env "$(python -I -c "import pathlib; print(pathlib.Path.home() / '.reflux-release' / 'dry-run.env')")" --out out
      - name: Verify the release locally
        shell: bash
        run: python -I tools/release/release.py verify out
      # What the draft will carry: the public files only (never the APK or AAB), checked as a downloader would, and the
      # release notes and the store "What's new" from CHANGELOG.md. A release needs the version's own section; a
      # rehearsal (an unreleased version) uses Unreleased.
      - name: The public release's files, release notes, and store text
        shell: bash
        env:
          ALLOW_UNRELEASED: ${{ inputs.tag == '' && '--allow-unreleased' || '' }}
        run: |
          version=$(sed -n 's/^reflux.version=//p' gradle.properties)
          python -I tools/release/release.py stage-public out --out public
          (cd public && sha256sum -c SHA256SUMS)
          if ls public/*.apk public/*.aab > /dev/null 2>&1; then echo "an Android package is in the public release"; exit 1; fi
          mkdir notes
          # shellcheck disable=SC2086 # the flag, or nothing
          python -I tools/release/release.py notes --version "$version" $ALLOW_UNRELEASED --out-notes notes/notes.md --out-store notes/store-whats-new.txt
          { echo "### Store What's new"; echo '```'; cat notes/store-whats-new.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Build provenance for every artifact
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            out/*.apk
            out/*.aab
            out/*.zip
            out/*.tar.xz
      # A release also carries the Linux archive built in the job above.
      - name: Build provenance for the Linux archive (release)
        if: inputs.tag != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/*.tar.gz
      - name: Verify the provenance against this repository, workflow, and commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          for f in out/*.apk out/*.aab out/*.zip out/*.tar.xz out/*.tar.gz; do
            [ -e "$f" ] || continue
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --source-digest "$sha"
          done
          { echo "### Attested artifacts ($sha)"; echo '```'; cat out/SHA256SUMS; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # The store files (APK, AAB) are in this artifact, which is how they reach the stores: kept 14 days, not the
      # default 90, and never attached to the GitHub release.
      - if: inputs.tag != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: out/
          retention-days: 14
          if-no-files-found: error
      - if: inputs.tag != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: notes/
          retention-days: 14
          if-no-files-found: error

  draft:
    name: Draft the GitHub release
    if: inputs.tag != ''
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write      # the draft release, and only here
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: out
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes
      # The public release is exactly the manifest's github-release artifacts and the three records (store-only Android:
      # the APK and AAB stay in the "release" artifact). stage-public copies those and verifies the copy as a download.
      - name: Stage the public files and draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          python3 -I tools/release/release.py stage-public out --out public
          ls public
          gh release create "$TAG" --draft --verify-tag --title "Reflux $TAG" --repo "$GITHUB_REPOSITORY" \
            --notes-file notes/notes.md public/*

  verify:
    name: Verify the draft independently
    if: inputs.tag != ''
    needs: draft
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write      # a draft is visible only to writers; this job only reads it and uploads nothing to it
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      # What a person downloading the release would do: fetch it from GitHub, check every checksum with no flags, check
      # that GitHub's attestation says this repository's workflow built each file, and run the release tool's own
      # verification of a public release. There is no Android package to read: none is on the release, and this job
      # confirms it.
      - name: Download, checksum, attestation, manifest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          mkdir dl && gh release download "$TAG" --dir dl --repo "$GITHUB_REPOSITORY"
          if ls dl/*.apk dl/*.aab > /dev/null 2>&1; then echo "an Android package is on the public release"; exit 1; fi
          names=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          if echo "$names" | grep -qE '\.(apk|aab)$'; then echo "an Android package is a release asset"; exit 1; fi
          (cd dl && sha256sum -c SHA256SUMS)
          for f in dl/*.zip dl/*.tar.gz dl/*.tar.xz; do
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          done
          python3 -I tools/release/release.py verify dl --public
      # The publication record (docs/RELEASE.md): written by the tool from the verified manifest, compared with the
      # digests GitHub holds, and kept as an artifact for the `release: record` commit; nothing here commits it.
      - name: The publication record
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          python3 -I tools/release/release.py publish-record dl --out record --expect-commit "$(git rev-parse HEAD)" --github-release "$TAG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published-record
          path: record/
          retention-days: 30
          if-no-files-found: error
      # Once the release is published with immutable releases enabled (a repository setting, owner), GitHub's release
      # attestation exists too; a draft has none, so this step only acts on a published, immutable release (a re-run
      # after publishing).
      - name: Release attestation (published, immutable releases only)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          state=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isImmutable --jq '"\(.isDraft) \(.isImmutable)"')
          if [ "$state" = "false true" ]; then
            gh release verify "$TAG" --repo "$GITHUB_REPOSITORY"
            for f in dl/*.zip dl/*.tar.gz dl/*.tar.xz dl/SHA256SUMS dl/manifest.json dl/provenance.intoto.json; do
              gh release verify-asset "$TAG" "$f" --repo "$GITHUB_REPOSITORY"
            done
          else
            echo "release state (draft immutable): $state; the release attestation exists once it is published as an immutable release"
          fi
