name: Release

# Builds a release from a tagged commit (docs/RELEASE.md, "Release system"): Reflux's Windows libmpv from source, the
# Android APK and bundle signed with the upload key, the Windows and Linux archives, the libmpv source bundle,
# SHA256SUMS, the manifest, and GitHub's signed build provenance for every artifact; then a DRAFT GitHub release
# holding them, which a separate job downloads and verifies on another operating system. Publishing the draft, and
# uploading to the stores, are people's decisions, made after the release checklist (docs/RELEASE.md). Run by hand only.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The release tag to build, v<version> (it must exist and match reflux.version)"
        required: true

permissions:
  contents: read

jobs:
  libmpv:
    name: Windows libmpv from source
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - run: |
          docker build -t reflux-libmpv tools/libmpv
          mkdir -p build/libmpv
          docker run --rm -v "$PWD:/src:ro" -v "$PWD/build/libmpv:/out" reflux-libmpv
          pin() { sed -n "s/^$1=//p" desktop/app/packaging/libmpv-windows.properties; }
          echo "$(pin dllSha256)  build/libmpv/libmpv-2.dll" | sha256sum -c
          echo "$(pin sourceSha256)  build/libmpv/libmpv-source.tar.xz" | sha256sum -c
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: libmpv
          path: build/libmpv/

  linux:
    name: Linux archive
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: ./gradlew --no-configuration-cache releaseInfo :desktop:app:packageDesktopArchive -Preflux.android=false
      - run: |
          mkdir out
          for f in desktop/app/build/release/*.tar.gz; do cp "$f" out/; cp build/release/release-info.json "out/$(basename "$f").release-info.json"; done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: out/

  release:
    name: Android, Windows, and the release
    needs: [libmpv, linux]
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: write      # the draft release
      id-token: write      # provenance signing
      attestations: write  # provenance storage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux
          path: linux
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: libmpv
          path: build/libmpv
      - name: The tag is the version
        shell: bash
        run: |
          version=$(sed -n 's/^reflux.version=//p' gradle.properties)
          test "v$version" = "${{ inputs.tag }}" || { echo "tag ${{ inputs.tag }} is not v$version"; exit 1; }
      # The upload key lives only in GitHub's encrypted secrets (docs/RELEASE.md, "Signing"); it is written to the
      # runner's temporary folder, passed to the build as REFLUX_SIGNING_* through a file, and never printed.
      - name: Build, sign, checksum, and describe
        shell: bash
        env:
          UPLOAD_KEY: ${{ secrets.REFLUX_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.REFLUX_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.REFLUX_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.REFLUX_UPLOAD_KEY_PASSWORD }}
        run: |
          key="$RUNNER_TEMP/upload.jks"
          printf '%s' "$UPLOAD_KEY" | base64 -d > "$key"
          printf 'REFLUX_SIGNING_STORE_FILE=%s\nREFLUX_SIGNING_STORE_PASSWORD=%s\nREFLUX_SIGNING_KEY_ALIAS=%s\nREFLUX_SIGNING_KEY_PASSWORD=%s\n' \
            "$key" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > "$RUNNER_TEMP/signing.env"
          python -I tools/release/release.py build --signing-env "$RUNNER_TEMP/signing.env" --out out --add linux/*.tar.gz
          rm -f "$key" "$RUNNER_TEMP/signing.env"
          python -I tools/release/release.py verify out
      - name: Build provenance for every artifact
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            out/*.apk
            out/*.aab
            out/*.zip
            out/*.tar.gz
            out/*.tar.xz
      - name: Draft the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.tag }}" --draft --verify-tag --title "Reflux ${{ inputs.tag }}" \
            --notes "Draft made by the release workflow. Release notes are added from CHANGELOG.md before publishing (docs/RELEASE.md)." \
            out/*.apk out/*.aab out/*.zip out/*.tar.gz out/*.tar.xz out/SHA256SUMS out/manifest.json out/provenance.intoto.json

  verify:
    name: Verify the draft independently
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      # aapt2 and apksigner, for the release tool's reading of the APK.
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: build-tools;36.0.0
      # What a person downloading the release would do: fetch it from GitHub, check every checksum, check that GitHub's
      # attestation says this repository's workflow built each file, and run the release tool's own verification.
      - name: Download, checksum, attestation, manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dl && gh release download "${{ inputs.tag }}" --dir dl --repo "${{ github.repository }}"
          (cd dl && sha256sum -c SHA256SUMS)
          for f in dl/*.apk dl/*.aab dl/*.zip dl/*.tar.gz dl/*.tar.xz; do
            gh attestation verify "$f" --repo "${{ github.repository }}" --signer-workflow "${{ github.repository }}/.github/workflows/release.yml"
          done
          python3 -I tools/release/release.py verify dl
