name: Release

# Two modes (docs/RELEASE.md, "Release system"):
#
# - Rehearsal, on every push: the release built from the pushed commit exactly as a release is (Reflux's Windows libmpv
#   from source, the Android APK and bundle, the Windows and Linux archives, the libmpv source bundle, SHA256SUMS, the
#   manifest), the Android packages signed by a throwaway key made in the runner whose certificate says it is not for
#   distribution. Every artifact gets GitHub's signed build provenance, verified in the same job against this
#   repository, this workflow, and this commit. Nothing is tagged, released, or kept: no app binary is uploaded.
# - Release, run by hand with a tag: the same build from the tagged commit, signed with the upload key, attested, and
#   a DRAFT GitHub release holding it, which a separate job downloads and verifies on another operating system.
#   Publishing the draft, and uploading to the stores, are people's decisions, made after the release checklist.
on:
  push:
  workflow_dispatch:
    inputs:
      tag:
        description: "The release tag to build, v<version> (it must exist and match reflux.version)"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  libmpv:
    name: Windows libmpv from source
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.sha }}
      # The build is reproducible and pinned (tools/libmpv/README.md), so an earlier build of the same recipe is
      # reused; whatever is restored must still match the pinned SHA-256s below, or the job fails.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: build/libmpv
          key: libmpv-${{ hashFiles('tools/libmpv/**', 'desktop/app/packaging/libmpv-windows.properties') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: |
          docker build -t reflux-libmpv tools/libmpv
          mkdir -p build/libmpv
          docker run --rm -v "$PWD:/src:ro" -v "$PWD/build/libmpv:/out" reflux-libmpv
      - run: |
          pin() { sed -n "s/^$1=//p" desktop/app/packaging/libmpv-windows.properties; }
          echo "$(pin dllSha256)  build/libmpv/libmpv-2.dll" | sha256sum -c
          echo "$(pin sourceSha256)  build/libmpv/libmpv-source.tar.xz" | sha256sum -c
      # The LGPL library and its source, passed to the Windows job; not an app build.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: libmpv
          path: build/libmpv/
          retention-days: 1

  linux:
    name: Linux archive
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write      # provenance signing (rehearsal)
      attestations: write  # provenance storage (rehearsal)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: ./gradlew --no-configuration-cache releaseInfo :desktop:app:packageDesktopArchive -Preflux.android=false
        env:
          # The metadata provider's application credential (DECISIONS.md, "TMDB: working non-commercial classification"),
          # for a real release only.
          REFLUX_TMDB_TOKEN: ${{ inputs.tag != '' && secrets.REFLUX_TMDB_TOKEN || '' }}
      - run: |
          mkdir out
          for f in desktop/app/build/release/*.tar.gz; do cp "$f" out/; cp build/release/release-info.json "out/$(basename "$f").release-info.json"; done
          (cd out && sha256sum ./*.tar.gz | tee SHA256SUMS)
      # A rehearsal attests the archive where it was built and checks the attestation here; a release attests it with
      # the rest of the release.
      - name: Build provenance (rehearsal)
        if: inputs.tag == ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/*.tar.gz
      - name: Verify the provenance (rehearsal)
        if: inputs.tag == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in out/*.tar.gz; do
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --source-digest "$GITHUB_SHA"
          done
      - if: inputs.tag != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: out/

  release:
    name: Android, Windows, and provenance
    needs: [libmpv, linux]
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write      # provenance signing
      attestations: write  # provenance storage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - if: inputs.tag != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux
          path: linux
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: libmpv
          path: build/libmpv
      - name: The tag is the version
        if: inputs.tag != ''
        shell: bash
        run: |
          version=$(sed -n 's/^reflux.version=//p' gradle.properties)
          test "v$version" = "${{ inputs.tag }}" || { echo "tag ${{ inputs.tag }} is not v$version"; exit 1; }
      # A release: the upload key lives only in GitHub's encrypted secrets (docs/RELEASE.md, "Signing"); it is written
      # to the runner's temporary folder, passed to the build as REFLUX_SIGNING_* through a file, and never printed.
      - name: Build, sign, checksum, and describe (release)
        if: inputs.tag != ''
        shell: bash
        env:
          REFLUX_TMDB_TOKEN: ${{ secrets.REFLUX_TMDB_TOKEN }}
          UPLOAD_KEY: ${{ secrets.REFLUX_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.REFLUX_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.REFLUX_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.REFLUX_UPLOAD_KEY_PASSWORD }}
        run: |
          key="$RUNNER_TEMP/upload.jks"
          printf '%s' "$UPLOAD_KEY" | base64 -d > "$key"
          printf 'REFLUX_SIGNING_STORE_FILE=%s\nREFLUX_SIGNING_STORE_PASSWORD=%s\nREFLUX_SIGNING_KEY_ALIAS=%s\nREFLUX_SIGNING_KEY_PASSWORD=%s\n' \
            "$key" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > "$RUNNER_TEMP/signing.env"
          python -I tools/release/release.py build --signing-env "$RUNNER_TEMP/signing.env" --out out --add linux/*.tar.gz
          rm -f "$key" "$RUNNER_TEMP/signing.env"
      # A rehearsal: a throwaway key made here (tools/release/make-dry-run-key.py, its certificate "Reflux internal dry
      # run (not for distribution)"), never the upload key, and no secret of any kind.
      - name: Build, sign with a throwaway key, checksum, and describe (rehearsal)
        if: inputs.tag == ''
        shell: bash
        run: |
          python -I tools/release/make-dry-run-key.py
          python -I tools/release/release.py build --signing-env "$(python -I -c "import pathlib; print(pathlib.Path.home() / '.reflux-release' / 'dry-run.env')")" --out out
      - name: Verify the release locally
        shell: bash
        run: python -I tools/release/release.py verify out
      - name: Build provenance for every artifact
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            out/*.apk
            out/*.aab
            out/*.zip
            out/*.tar.xz
      # A release also carries the Linux archive built in the job above.
      - name: Build provenance for the Linux archive (release)
        if: inputs.tag != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/*.tar.gz
      - name: Verify the provenance against this repository, workflow, and commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          for f in out/*.apk out/*.aab out/*.zip out/*.tar.xz out/*.tar.gz; do
            [ -e "$f" ] || continue
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --source-digest "$sha"
          done
          { echo "### Attested artifacts ($sha)"; echo '```'; cat out/SHA256SUMS; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - if: inputs.tag != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: out/

  draft:
    name: Draft the GitHub release
    if: inputs.tag != ''
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write      # the draft release, and only here
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: out
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.tag }}" --draft --verify-tag --title "Reflux ${{ inputs.tag }}" --repo "$GITHUB_REPOSITORY" \
            --notes "Draft made by the release workflow. Release notes are added from CHANGELOG.md before publishing (docs/RELEASE.md)." \
            out/*.apk out/*.aab out/*.zip out/*.tar.gz out/*.tar.xz out/SHA256SUMS out/manifest.json out/provenance.intoto.json

  verify:
    name: Verify the draft independently
    if: inputs.tag != ''
    needs: draft
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      # aapt2 and apksigner, for the release tool's reading of the APK.
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: build-tools;36.0.0
      # What a person downloading the release would do: fetch it from GitHub, check every checksum, check that GitHub's
      # attestation says this repository's workflow built each file, and run the release tool's own verification.
      - name: Download, checksum, attestation, manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dl && gh release download "${{ inputs.tag }}" --dir dl --repo "${{ github.repository }}"
          (cd dl && sha256sum -c SHA256SUMS)
          for f in dl/*.apk dl/*.aab dl/*.zip dl/*.tar.gz dl/*.tar.xz; do
            gh attestation verify "$f" --repo "${{ github.repository }}" --signer-workflow "${{ github.repository }}/.github/workflows/release.yml"
          done
          python3 -I tools/release/release.py verify dl
