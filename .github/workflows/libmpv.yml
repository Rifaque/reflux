name: Windows libmpv

# Rebuilds Reflux's Windows libmpv from tools/libmpv whenever its sources or build change, and fails unless the result
# is byte for byte the DLL and source bundle pinned in desktop/app/packaging/libmpv-windows.properties: the pin is only
# changed together with a build that reproduces it (tools/libmpv/README.md).
on:
  push:
    paths:
      - tools/libmpv/**
      - desktop/app/packaging/libmpv-windows.properties
      - tools/ci/fetch_libmpv_sources.py
      - .github/workflows/libmpv.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and compare with the pin
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Every source archive is kept only with the SHA-256 in sources.txt: a wrong download is deleted and fetched again,
      # at most three times, and what the server sent is described (zlib.net has sent other bytes as a success; the CI
      # performance audit, section 5). The verified archives are the build's /cache, read-only; build.sh checks each
      # digest again before unpacking. The build itself is never cached here: this workflow proves the pins reproduce.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/libmpv-sources
          key: libmpv-sources-${{ hashFiles('tools/libmpv/sources.txt') }}
      - name: Fetch and verify the sources
        run: python3 -I tools/ci/fetch_libmpv_sources.py tools/libmpv/sources.txt "$RUNNER_TEMP/libmpv-sources"
      - name: Build
        run: |
          docker build -t reflux-libmpv tools/libmpv
          mkdir -p build/libmpv
          docker run --rm -v "$PWD:/src:ro" -v "$PWD/build/libmpv:/out" -v "$RUNNER_TEMP/libmpv-sources:/cache:ro" reflux-libmpv
      - name: Compare with the pin
        run: |
          pin() { sed -n "s/^$1=//p" desktop/app/packaging/libmpv-windows.properties; }
          echo "$(pin dllSha256)  build/libmpv/libmpv-2.dll" | sha256sum -c
          echo "$(pin sourceSha256)  build/libmpv/libmpv-source.tar.xz" | sha256sum -c
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: libmpv
          path: build/libmpv/
