name: Windows libmpv

# Rebuilds Reflux's Windows libmpv from tools/libmpv whenever its sources or build change, and fails unless the result
# is byte for byte the DLL and source bundle pinned in desktop/app/packaging/libmpv-windows.properties: the pin is only
# changed together with a build that reproduces it (tools/libmpv/README.md).
on:
  push:
    paths:
      - tools/libmpv/**
      - desktop/app/packaging/libmpv-windows.properties
      - .github/workflows/libmpv.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and compare with the pin
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: |
          docker build -t reflux-libmpv tools/libmpv
          mkdir -p build/libmpv
          docker run --rm -v "$PWD:/src:ro" -v "$PWD/build/libmpv:/out" reflux-libmpv
      - name: Compare with the pin
        run: |
          pin() { sed -n "s/^$1=//p" desktop/app/packaging/libmpv-windows.properties; }
          echo "$(pin dllSha256)  build/libmpv/libmpv-2.dll" | sha256sum -c
          echo "$(pin sourceSha256)  build/libmpv/libmpv-source.tar.xz" | sha256sum -c
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: libmpv
          path: build/libmpv/
