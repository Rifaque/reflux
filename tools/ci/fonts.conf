<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  The sans-serif the Linux CI job's text-measuring tests render with (FONTCONFIG_FILE, set by the CI workflow and by
  linux-check.sh around the Gradle check). Reflux ships no font of its own: it draws with the platform's default, so a
  layout test's measurements are those of whatever font the machine resolves. Without this, Linux resolves DejaVu Sans,
  which is about 10 to 20 percent wider than the Segoe UI and Roboto that Windows and Android resolve, and a row that
  fits on a phone there (Resume, From the start, watched, favorite on 412 dp) wraps on Linux. Liberation Sans has
  Arial's metrics, which are close to those. Everything else is the system's own configuration.
-->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <match target="pattern">
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Liberation Sans</string></edit>
  </match>
</fontconfig>
