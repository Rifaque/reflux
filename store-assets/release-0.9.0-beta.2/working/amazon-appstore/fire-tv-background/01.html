<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Reflux Fire TV background</title>
<link rel="stylesheet" href="../../campaign.css">
<style>
html, body { width: 1920px; height: 1080px; }
/* No logo, no title (Amazon shows its own over it): colour from Reflux's own player frame (the Fire TV capture), blurred to atmosphere,
   weighted to the right inside the 1214 x 830 subject area, fading into the app's background on the left. */
.field { position: absolute; left: 560px; top: 60px; width: 1400px; height: 960px; object-fit: cover; filter: blur(70px) saturate(1.2); opacity: 0.85; }
.fade { position: absolute; inset: 0; background: linear-gradient(90deg, #0A0A0B 0%, rgba(10,10,11,0.92) 30%, rgba(10,10,11,0.35) 65%, rgba(10,10,11,0.2) 100%), linear-gradient(0deg, rgba(10,10,11,0.7), rgba(10,10,11,0) 40%); }
</style></head>
<body class="plain"><img class="field" src="../../../source-screenshots/firetv-player.png" alt=""><div class="fade"></div></body></html>
